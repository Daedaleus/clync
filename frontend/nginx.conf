server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers — applied to all responses not overridden by a child block.
    # IMPORTANT: nginx does not inherit add_header into location blocks that
    # define their own add_header directives, so they are repeated below.
    add_header X-Content-Type-Options  "nosniff"                                  always;
    add_header X-Frame-Options         "DENY"                                     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control          "public, immutable"                       always;
        add_header X-Content-Type-Options "nosniff"                                always;
        add_header X-Frame-Options        "DENY"                                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }

    # PWA manifest and JSON files must not be cached so updates propagate
    location ~* \.(webmanifest|json)$ {
        add_header Cache-Control          "no-store"                               always;
        add_header X-Content-Type-Options "nosniff"                                always;
        add_header X-Frame-Options        "DENY"                                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }

    # Service worker must never be cached
    location = /sw.js {
        add_header Cache-Control          "no-store"                               always;
        add_header X-Content-Type-Options "nosniff"                                always;
        add_header X-Frame-Options        "DENY"                                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }
}
