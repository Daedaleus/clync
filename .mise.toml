[tools]
node = "26.1.0"
rust = "1.95.0"

[env]
RUST_LOG = "info"
RUST_BACKTRACE = "1"

[tasks.frontend]
description = "Start the Vite dev server"
run = "npm run dev"
dir = "{{config_root}}/frontend"

[tasks.backend]
description = "Start the Rust backend"
run = "cargo run"
dir = "{{config_root}}/backend"

[tasks.docker]
description = "Start SurrealDB + Keycloak via Docker Compose"
run = "docker compose -f docker-compose.local.yml up"
dir = "{{config_root}}/infrastructure"

[tasks.test]
description = "Run all tests: backend unit, frontend unit, frontend e2e (requires full stack)"
dir = "{{config_root}}"
run = """
cd backend && cargo test
cd ../frontend && npm run test:run && npm run test:e2e
"""

[tasks.storybook]
description = "Start Storybook component library"
run = "npm run storybook"
dir = "{{config_root}}/frontend"

[tasks.ansible-lint]
description = "Lint Ansible playbook"
run = "ansible-lint deploy.yml"
dir = "{{config_root}}/ansible"

[tasks.deploy]
description = "Deploy to production via Ansible (requires ansible/vars.yml)"
run = "ansible-playbook deploy.yml -e @vars.yml"
dir = "{{config_root}}/ansible"

[tasks."coverage:frontend"]
description = "Run frontend unit tests with coverage (HTML report in frontend/coverage/)"
run = "npm run test:coverage"
dir = "{{config_root}}/frontend"

[tasks."coverage:backend"]
description = "Run backend tests with llvm-cov (HTML report in backend/target/llvm-cov/html/)"
run = "cargo llvm-cov --html"
dir = "{{config_root}}/backend"

[tasks."coverage:backend:summary"]
description = "Print backend coverage summary to terminal (no HTML)"
run = "cargo llvm-cov"
dir = "{{config_root}}/backend"

[tasks.check]
description = "Run all quality checks (fmt, clippy, tests, lint, ansible)"
dir = "{{config_root}}"
run = """
cd backend && cargo fmt --check && cargo clippy -- -D warnings && cargo test
cd ../frontend && npm run lint && npm run test:run
cd ../ansible && ansible-lint deploy.yml
"""
