name: clync

# proxy      — external; created and managed by Traefik.
#              Services on this network are reachable via Traefik labels.
# internal   — private; no Traefik attachment.
#              Used for container-to-container traffic (DB, auth, backend).
# monitoring — private; isolated metrics/log pipeline.
#              Only backend (scrape target), prometheus, loki, promtail,
#              and grafana are attached. Nothing else touches this network.
networks:
  proxy:
    external: true
  internal:
  monitoring:

services:

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/daedaleus/clync-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - proxy
    healthcheck:
      # nginx-unprivileged has busybox wget; listens on 8080 (non-root)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-frontend.rule=Host(`${FRONTEND_HOST}`)"
      - "traefik.http.routers.clync-frontend.entrypoints=websecure"
      - "traefik.http.routers.clync-frontend.tls=true"
      - "traefik.http.services.clync-frontend.loadbalancer.server.port=8080"

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/daedaleus/clync-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      surrealdb:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - proxy
      - internal
      - monitoring
    environment:
      APP__DATABASE__URL: "surrealdb:8000"
      APP__DATABASE__NAMESPACE: clync
      APP__DATABASE__NAME: clync
      APP__DATABASE__USERNAME: "${SURREALDB_USER}"
      APP__DATABASE__PASSWORD: "${SURREALDB_PASS}"
      # Resolved via internal network — bypasses Traefik for JWKS refresh
      APP__KEYCLOAK__JWKS_URI: "http://keycloak:8080/realms/${VITE_KEYCLOAK_REALM:-Clync}/protocol/openid-connect/certs"
      APP__KEYCLOAK__REALM: "${VITE_KEYCLOAK_REALM:-Clync}"
      APP__KEYCLOAK__ADMIN_URL: "http://keycloak:8080"
      APP__KEYCLOAK__ADMIN_USER: "${KC_ADMIN_USER}"
      APP__KEYCLOAK__ADMIN_PASSWORD: "${KC_ADMIN_PASS}"
      APP__CORS__FRONTEND_URL: "${FRONTEND_URL}"
      APP__VAPID__PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
      APP__VAPID__PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      APP__VAPID__SUBJECT: "${VAPID_SUBJECT}"
      APP__RAWG__API_KEY: "${RAWG_API_KEY:-}"
    healthcheck:
      # wget is installed in the backend Dockerfile's runtime stage
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-backend.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.clync-backend.entrypoints=websecure"
      - "traefik.http.routers.clync-backend.tls=true"
      - "traefik.http.services.clync-backend.loadbalancer.server.port=3000"

  # ── Keycloak ────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start --import-realm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_ADMIN_USER}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASS}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "${POSTGRES_USER:-keycloak}"
      KC_DB_PASSWORD: "${POSTGRES_PASS}"
      KC_HOSTNAME: "${KEYCLOAK_HOST}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-keycloak.rule=Host(`${KEYCLOAK_HOST}`)"
      - "traefik.http.routers.clync-keycloak.entrypoints=websecure"
      - "traefik.http.routers.clync-keycloak.tls=true"
      - "traefik.http.services.clync-keycloak.loadbalancer.server.port=8080"

  # ── SurrealDB ───────────────────────────────────────────────────────────────
  surrealdb:
    image: docker.io/surrealdb/surrealdb:v2
    command: "start --bind 0.0.0.0:8000 --user ${SURREALDB_USER} --pass ${SURREALDB_PASS} file:///data/clync.db"
    user: "0:0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal
    volumes:
      - surrealdb_data:/data
    healthcheck:
      # Uses the surreal binary's built-in readiness check (distroless image,
      # no shell or network tools available).
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── PostgreSQL (Keycloak backend) ───────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: "${POSTGRES_USER:-keycloak}"
      POSTGRES_PASSWORD: "${POSTGRES_PASS}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: docker.io/prom/prometheus:v3
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - monitoring
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # ── Loki ────────────────────────────────────────────────────────────────────
  loki:
    image: docker.io/grafana/loki:3
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - monitoring
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  # ── Promtail ─────────────────────────────────────────────────────────────────
  promtail:
    image: docker.io/grafana/promtail:3
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - monitoring
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: docker.io/grafana/grafana:13.0.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - proxy
      - monitoring
    environment:
      GF_SERVER_ROOT_URL: "https://${MONITORING_HOST}"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASS}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Keycloak OAuth2
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      # Only Keycloak users with the 'admin' realm role can log in.
      # STRICT=true: empty role expression → access denied (non-admins blocked).
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://${KEYCLOAK_HOST}/realms/${VITE_KEYCLOAK_REALM:-Clync}/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://${KEYCLOAK_HOST}/realms/${VITE_KEYCLOAK_REALM:-Clync}/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://${KEYCLOAK_HOST}/realms/${VITE_KEYCLOAK_REALM:-Clync}/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'admin') && 'Admin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-grafana.rule=Host(`${MONITORING_HOST}`)"
      - "traefik.http.routers.clync-grafana.entrypoints=websecure"
      - "traefik.http.routers.clync-grafana.tls=true"
      - "traefik.http.services.clync-grafana.loadbalancer.server.port=3000"

volumes:
  surrealdb_data:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
