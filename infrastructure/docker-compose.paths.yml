name: clync

# Path-based routing — backend (/api) and Keycloak (/auth) share the
# frontend domain. Use with a matching .env file:
#   docker compose -f docker-compose.paths.yml --env-file .env-paths.example up -d
#
# proxy  — external; created and managed by Traefik.
# internal — private; no Traefik attachment.
networks:
  proxy:
    external: true
    name: traefik
  internal:

services:

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    image: clync-frontend
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-Clync}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-clync}
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-frontend.rule=Host(`${FRONTEND_HOST}`)"
      - "traefik.http.routers.clync-frontend.entrypoints=web-secure"
      - "traefik.http.routers.clync-frontend.service=clync-frontend"
      - "traefik.http.routers.clync-frontend.tls=true"
      - "traefik.http.routers.clync-frontend.tls.certresolver=default"
      - "traefik.http.services.clync-frontend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    image: clync-backend
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      surrealdb:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - proxy
      - internal
    environment:
      APP__DATABASE__URL: "surrealdb:8000"
      APP__DATABASE__NAMESPACE: clync
      APP__DATABASE__NAME: clync
      APP__DATABASE__USERNAME: "${SURREALDB_USER}"
      APP__DATABASE__PASSWORD: "${SURREALDB_PASS}"
      # KC_HTTP_RELATIVE_PATH=/auth shifts all Keycloak paths internally
      APP__KEYCLOAK__JWKS_URI: "http://keycloak:8080/auth/realms/${VITE_KEYCLOAK_REALM:-Clync}/protocol/openid-connect/certs"
      APP__KEYCLOAK__ADMIN_URL: "http://keycloak:8080/auth"
      APP__KEYCLOAK__REALM: "${VITE_KEYCLOAK_REALM:-Clync}"
      APP__KEYCLOAK__ADMIN_USER: "${KC_ADMIN_USER}"
      APP__KEYCLOAK__ADMIN_PASSWORD: "${KC_ADMIN_PASS}"
      APP__CORS__FRONTEND_URL: "${FRONTEND_URL}"
      APP__VAPID__PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
      APP__VAPID__PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      APP__VAPID__SUBJECT: "${VAPID_SUBJECT}"
      APP__RAWG__API_KEY: "${RAWG_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-backend.rule=Host(`${API_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.clync-backend.entrypoints=web-secure"
      - "traefik.http.routers.clync-backend.service=clync-backend"
      - "traefik.http.routers.clync-backend.tls=true"
      - "traefik.http.routers.clync-backend.tls.certresolver=default"
      - "traefik.http.services.clync-backend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"

  # ── Keycloak ────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start --import-realm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_ADMIN_USER}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASS}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "${POSTGRES_USER:-keycloak}"
      KC_DB_PASSWORD: "${POSTGRES_PASS}"
      KC_HOSTNAME: "${KEYCLOAK_HOST}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clync-keycloak.rule=Host(`${KEYCLOAK_HOST}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.clync-keycloak.entrypoints=web-secure"
      - "traefik.http.routers.clync-keycloak.service=clync-keycloak"
      - "traefik.http.routers.clync-keycloak.tls=true"
      - "traefik.http.routers.clync-keycloak.tls.certresolver=default"
      - "traefik.http.services.clync-keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

  # ── SurrealDB ───────────────────────────────────────────────────────────────
  surrealdb:
    image: docker.io/surrealdb/surrealdb:v2
    command: "start --bind 0.0.0.0:8000 --user ${SURREALDB_USER} --pass ${SURREALDB_PASS} file:///data/clync.db"
    user: "0:0"
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── PostgreSQL (Keycloak backend) ───────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: "${POSTGRES_USER:-keycloak}"
      POSTGRES_PASSWORD: "${POSTGRES_PASS}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  surrealdb_data:
  postgres_data:
