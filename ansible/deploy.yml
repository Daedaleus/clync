---
# Clync deploy playbook
#
# Usage:
#   cp ansible/vars.yml.example ansible/vars.yml
#   # fill in ansible/vars.yml
#   ansible-playbook ansible/deploy.yml
#
# To deploy a specific version:
#   ansible-playbook ansible/deploy.yml -e image_tag=0.6.0
#
# To skip service restart:
#   ansible-playbook ansible/deploy.yml -e start_services=false

- name: Register deploy target
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Add server to inventory
      ansible.builtin.add_host:
        name: "{{ server }}"
        groups: deploy_target
        ansible_user: "{{ ansible_user | default(omit) }}"


- name: Deploy Clync
  hosts: deploy_target
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/vars.yml"

  vars:
    root_dir: "{{ playbook_dir | dirname }}"
    infra_dir: "{{ root_dir }}/infrastructure"
    compose_src: "{{ infra_dir }}/{{ 'docker-compose.paths.yml' if routing == 'paths' else 'docker-compose.yml' }}"
    playbook_version: "{{ (lookup('file', root_dir + '/frontend/package.json') | from_json).version }}"

  tasks:
    - name: Show deploy info
      ansible.builtin.debug:
        msg: "Deploying Clync v{{ playbook_version }} (tag: {{ image_tag | default('latest') }}) to {{ inventory_hostname }}"

    - name: Create remote app directory
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Docker proxy network exists
      ansible.builtin.command: docker network create proxy
      changed_when: true
      failed_when: false

    - name: Upload docker-compose.yml
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ remote_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Generate and upload .env
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/env.j2"
        dest: "{{ remote_dir }}/.env"
        mode: "0600"

    - name: Create remote keycloak directory
      ansible.builtin.file:
        path: "{{ remote_dir }}/keycloak"
        state: directory
        mode: "0755"

    - name: Upload Keycloak realm JSON
      ansible.builtin.copy:
        src: "{{ infra_dir }}/keycloak/Clync-realm.json"
        dest: "{{ remote_dir }}/keycloak/Clync-realm.json"
        mode: "0644"

    - name: Pull images from GHCR
      ansible.builtin.command: >-
        docker compose
        -f {{ remote_dir }}/docker-compose.yml
        --env-file {{ remote_dir }}/.env
        pull
      changed_when: true

    - name: Start services
      ansible.builtin.command: >-
        docker compose
        -f {{ remote_dir }}/docker-compose.yml
        --env-file {{ remote_dir }}/.env
        up -d --no-build
      when: start_services | default(true) | bool
      changed_when: true
